  blockquote_padding_color: "#0ea5a4"
  blockquote_background_color: "#ecfeff"
  scrollbar_color: "#0f766e"
  meta_theme_color_light: "#f5f7fb"
  meta_theme_color_dark: "#0f172a"

rounded_corners_ui: true

